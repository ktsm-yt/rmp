# PR と main への push で、拡張 (型・組み上げ・単体) と受信箱の試験を回す。
# 受信箱は ps の環境変数の読み方が macOS 前提なので macOS で回す。
# e2e (npm run e2e) はここでは回さず、手元の npm run check で回す。runner では OS ごとに環境由来で 1 件ずつ落ちる
# (Linux: 7 IME の確定が起きない / macOS: 22 PDF の日本語の文字の層が出ない、2026-11-19)。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: 型
        run: npx tsc --noEmit -p .
      - name: 組み上げ (単体試験が dist / dist-test / dist-firefox を読む)
        run: |
          node build.mjs
          node build.mjs --test
          node build.mjs --firefox
      - name: 単体
        run: npx vitest run

  inbox:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 受信箱
        run: python3 -u inbox/test_rmp_inbox.py -v
