# PR と main への push で、拡張 (型・単体・e2e) と受信箱の試験を回す。
# どちらも macOS で回す: 受信箱は ps の環境変数の読み方が macOS 前提、拡張の e2e も macOS の Chromium の IME の振る舞い
# (変換中の Enter の後に押した Enter で変換が確定する) を前提にしている。Linux の Chromium では確定せず、試験 7 が落ちる。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: 型
        run: npx tsc --noEmit -p .
      - name: 組み上げ (単体試験が dist / dist-test / dist-firefox を読む)
        run: |
          node build.mjs
          node build.mjs --test
          node build.mjs --firefox
      - name: 単体
        run: npx vitest run
      - name: e2e 用の Chromium
        run: npx playwright install chromium
      - name: e2e
        # Chromium の SingletonSocket のパスが長すぎると起動直後に落ちるので、試験の一時置き場を短いパスにする
        env:
          RMP_E2E_TEMP: /tmp/rmp-e2e
        run: npx playwright test --trace off
      - name: e2e の結果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: extension/test-results
          retention-days: 7

  inbox:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 調査用 (後で消す): macOS の runner だと受信箱の試験が 1 件 40 秒近くかかる。受信箱が呼ぶものの時間を測る
      - name: 時間を測る
        run: |
          time /bin/ps -axo pid=,command= | wc -l
          time /bin/ps -axo pid=,ppid=,lstart=,comm= | wc -l
          time /bin/ps -Eww -o pid=,command= -p $$ | wc -c
          time python3 -c 'import socket; print(socket.getfqdn("127.0.0.1"))'
          time python3 -c 'import socket; print(socket.gethostbyaddr("127.0.0.1"))' || true
      - name: 1 件だけ回して、15 秒ごとにどこで待っているかを出す (調査用)
        run: |
          cd inbox
          timeout 100 python3 -u -c 'import faulthandler, sys, runpy; faulthandler.dump_traceback_later(15, repeat=True); sys.argv = ["t", "-v", "Deliver.test_a_closed_pane_is_not_live"]; runpy.run_path("test_rmp_inbox.py", run_name="__main__")' || true
      - name: 受信箱
        run: python3 -u inbox/test_rmp_inbox.py -v Inbox
