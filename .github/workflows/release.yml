# v* タグの push で、CHANGELOG.md の同じ版の節を本文にした GitHub Release を作り、
# 組み上げた Chrome 用の拡張を rmp-chrome.zip として添付する (使う人が Node.js を入れずに済むように)。
# 名前に版を入れないのは、README の releases/latest/download/rmp-chrome.zip で常に最新を指すため。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Chrome 用の拡張を組み上げて zip にする
        working-directory: extension
        run: |
          npm ci
          npm run build
          (cd dist && zip -qr ../../rmp-chrome.zip .)
      - name: CHANGELOG の節を取り出してリリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v t="$TAG" '/^## /{p = ($2 == t); next} p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md に ## $TAG の節が無い" >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md rmp-chrome.zip
